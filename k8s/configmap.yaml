apiVersion: v1
kind: ConfigMap
metadata:
  name: datacollab-config
data:
  NODE_ENV: production
  PORT: '5000'
  REDIS_URL: redis://redis:6379
  # The kind port mapping serves the app on :8080, so allow both forms of the local address.
  FRONTEND_URL: http://datacollab.localhost,http://datacollab.localhost:8080
  UPLOAD_DIR: /app/uploads
  QUERY_TIMEOUT_MS: '5000'
  QUERY_CACHE_TTL_SECONDS: '300'
  LLM_PROVIDER: gemini
  # The API (not the worker) runs migrations on start.
  RUN_MIGRATIONS: 'true'
  # Local demo cluster: high enough that `make k8s-load` reaches the API instead of getting 429s.
  RATE_LIMIT_QUERY_PER_MIN: '100000'
