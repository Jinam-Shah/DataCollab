# ingress-nginx routes one host to the SPA and the API (REST, Socket.io and MCP).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datacollab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 60m
    nginx.ingress.kubernetes.io/proxy-read-timeout: '120'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '120'
spec:
  ingressClassName: nginx
  rules:
    - host: datacollab.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
