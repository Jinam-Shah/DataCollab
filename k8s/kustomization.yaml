# Local Kubernetes deployment for kind: kubectl apply -k k8s   (see k8s/README.md, make k8s-up)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: datacollab
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - uploads-pvc.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: datacollab
