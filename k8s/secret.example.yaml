# Example only; `make k8s-up` creates the real secret with random passwords:
#   kubectl -n datacollab create secret generic datacollab-secrets --from-literal=...
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: datacollab-secrets
  namespace: datacollab
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://datacollab:change-me@postgres:5432/datacollab
  DATABASE_READER_URL: postgresql://datacollab_reader:change-me-too@postgres:5432/datacollab
  JWT_SECRET: change-me
  GEMINI_API_KEY: ''
