server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/dashboard, /runs) all serve the SPA.
  location / {
    try_files $uri /index.html;
  }
}
