# Local development stack: docker compose up --build
# App: http://localhost:3000   API: http://localhost:5000
# Demo data: docker compose exec api node dist/scripts/seed_demo.js
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datacollab
      POSTGRES_PASSWORD: datacollab
      POSTGRES_DB: datacollab
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U datacollab']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file: [{ path: ./backend/.env, required: false }]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://datacollab:datacollab@postgres:5432/datacollab
      DATABASE_READER_URL: postgresql://datacollab_reader:reader_local_pw@postgres:5432/datacollab
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
      RUN_MIGRATIONS: 'true'
    ports: ['5000:5000']
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: ['node', 'dist/worker.js']
    env_file: [{ path: ./backend/.env, required: false }]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 'false'
    # Uploads are written by the API and read by the worker, so they share a volume.
    volumes: [uploads:/app/uploads]
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000
    ports: ['3000:8080']
    depends_on: [api]

volumes:
  pgdata:
  uploads:
